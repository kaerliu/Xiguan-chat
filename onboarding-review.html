<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Onboarding · 评审后主流程</title><style>
*{box-sizing:border-box}body{margin:0;font:12px/18px Inter,"PingFang SC",sans-serif;color:#262626;background:#f1f1f1}header{min-height:52px;padding:8px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid #e2e2e2;background:white}header strong{font-weight:600;margin-right:12px}button,select{font:inherit;border:1px solid #e2e2e2;border-radius:6px;padding:6px 10px;background:white;color:#6a6a6a;cursor:pointer}button.active{color:#0a5e46;background:#e9f6f1;border-color:#e9f6f1}header>span{margin-left:auto;color:#848484;font-size:11px}iframe{display:block;border:0;width:100%;max-width:100%;margin:auto;height:calc(100dvh - 52px)}@media(max-width:900px){header>span{width:100%;margin:0}iframe{height:calc(100dvh - 96px)}}
</style></head><body><header><strong>Onboarding 交互评审</strong><button data-flow="new" class="active">官网输入 → 注册</button><button data-flow="direct">先注册 → 输入官网</button><button data-flow="return">回访用户</button><select id="scenario"><option value="">正常流程</option><option value="preview=blocked">官网无法预览</option><option value="color=fallback">主题色提取失败</option><option value="parse=failed">解析失败与重试</option></select><select id="size"><option value="100%">适应窗口</option><option value="1280px">1280 桌面</option><option value="1440px">1440 桌面</option></select><span>前端演示 · 微信授权、官网解析和回答使用模拟结果</span></header><iframe id="preview" src="./index.html?flow=new" title="Onboarding 产品界面"></iframe><script>
let flow='new';const frame=document.querySelector('#preview');function openFlow(){frame.src='./index.html'+(flow==='return'?'?':'?flow='+flow+'&')+document.querySelector('#scenario').value;document.querySelectorAll('[data-flow]').forEach(b=>b.classList.toggle('active',b.dataset.flow===flow))}document.querySelectorAll('[data-flow]').forEach(b=>b.onclick=()=>{flow=b.dataset.flow;openFlow()});document.querySelector('#scenario').onchange=openFlow;document.querySelector('#size').onchange=e=>frame.style.width=e.target.value;
</script></body></html>
